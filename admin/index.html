<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>REIA Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
      /* ── Global ── */
      *, *::before, *::after { box-sizing: border-box; }

      body, #nc-root {
        font-family: 'Poppins', sans-serif !important;
        background: #fafaf8 !important;
      }

      /* ── Top toolbar ── */
      [class*="AppHeader"], [class*="app-header"], header {
        background: #fff !important;
        border-bottom: 1px solid #e4e3de !important;
        box-shadow: none !important;
      }

      /* ── Sidebar / collection list ── */
      [class*="SidebarNavList"], [class*="sidebar"], nav[class] {
        background: #f4f3f0 !important;
        border-right: 1px solid #e4e3de !important;
      }

      /* ── Buttons — primary (Save/Publish) ── */
      button[class*="success"],
      button[class*="primary"],
      [class*="PublishControl"] button:first-child,
      [class*="ToolbarSaveButton"] {
        background: linear-gradient(135deg, #6B2FFF, #FF2D78) !important;
        border: none !important;
        border-radius: 6px !important;
        font-family: 'Poppins', sans-serif !important;
        font-size: 12px !important;
        font-weight: 500 !important;
        letter-spacing: 0.06em !important;
        box-shadow: none !important;
      }

      /* ── Buttons — secondary ── */
      button[class*="default"],
      [class*="DeleteButton"] {
        border-radius: 6px !important;
        font-family: 'Poppins', sans-serif !important;
        font-size: 12px !important;
        box-shadow: none !important;
      }

      /* ── Inputs & selects ── */
      input[type="text"],
      input[type="number"],
      input[type="email"],
      textarea,
      select,
      [class*="TextControl"],
      [class*="NumberControl"] {
        font-family: 'Poppins', sans-serif !important;
        border-radius: 6px !important;
        border-color: #e4e3de !important;
        background: #fff !important;
      }

      input:focus, textarea:focus, select:focus,
      [class*="focused"] {
        border-color: #6B2FFF !important;
        outline: none !important;
        box-shadow: 0 0 0 2px rgba(107,47,255,0.12) !important;
      }

      /* ── Card / list items ── */
      [class*="ListItemTopBar"],
      [class*="ObjectWidgetTopBar"],
      [class*="ListCard"] {
        background: #f4f3f0 !important;
        border: 1px solid #e4e3de !important;
        border-radius: 6px !important;
      }

      /* ── Labels ── */
      label, [class*="FieldLabel"] {
        font-family: 'Poppins', sans-serif !important;
        font-size: 11px !important;
        font-weight: 500 !important;
        letter-spacing: 0.08em !important;
        text-transform: uppercase !important;
        color: #888880 !important;
      }

      /* ── Active nav item ── */
      [class*="NavLink"][class*="active"],
      [class*="navLink"][class*="active"] {
        background: linear-gradient(135deg, #6B2FFF, #FF2D78) !important;
        border-radius: 4px !important;
        color: #fff !important;
      }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-thumb { background: #d4d3ce; border-radius: 2px; }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>

  <body>
    <!-- REQUIRED ROOT ELEMENT -->
    <div id="nc-root"></div>

    <!-- Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Custom preview -->
    <script src="/admin/preview.js"></script>
  </body>
</html>
