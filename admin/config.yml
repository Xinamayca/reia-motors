backend:
  name: github
  repo: llacle/reia-motors
  branch: main
  base_url: https://reiamotors.com
  auth_endpoint: api/auth

logo_url: /img/reia-logo.svg

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "cars"
    label: "Cars"
    files:
      - name: "carsdata"
        label: "Cars List"
        file: "data/cars.json"
        format: "json"
        fields:
          - label: "Cars"
            name: "cars"
            widget: "list"
            summary: "{{title}} — {{currency}} {{price}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Currency", name: "currency", widget: "string", default: "AWG" }
              - { label: "Price", name: "price", widget: "number" }
              - { label: "Body type", name: "body", widget: "select", options: ["SUV","Sedan","Hatchback","Truck","Van","Motorcycle"] }
              - { label: "Fuel", name: "fuel", widget: "select", options: ["Gasoline","Diesel","Hybrid","Electric"] }
              - { label: "Transmission", name: "trans", widget: "select", options: ["Automatic","Manual"] }
              - { label: "KM", name: "km", widget: "number" }
              - { label: "Year", name: "year", widget: "number" }
              - label: "Images"
                name: "images"
                widget: "list"
                max: 8
                field: { label: "Image", name: "image", widget: "image" }
              - { label: "Featured", name: "featured", widget: "boolean", default: false }
              - { label: "Sold", name: "sold", widget: "boolean", default: false, required: false }